<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Минималистичный сервис аналитики для Ozon с калькулятором прибыли" />
    <meta name="theme-color" content="#007AFF" />
    <title>Ozon Analytics - Аналитика и калькулятор прибыли</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background: #f5f5f7;
      }
      
      #root {
        min-height: 100vh;
      }
      
      /* Loading spinner */
      .app-loader {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #f5f5f7;
        z-index: 9999;
      }
      
      .loader-logo {
        width: 64px;
        height: 64px;
        margin-bottom: 24px;
        animation: pulse 2s ease-in-out infinite;
      }
      
      .loader-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(0, 122, 255, 0.1);
        border-top-color: #007AFF;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      
      .loader-text {
        margin-top: 16px;
        color: #8E8E93;
        font-size: 14px;
        font-weight: 500;
      }
      
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(0.95); }
      }
      
      @media (prefers-color-scheme: dark) {
        body {
          background: #000000;
        }
        .app-loader {
          background: #000000;
        }
        .loader-spinner {
          border-color: rgba(10, 132, 255, 0.1);
          border-top-color: #0A84FF;
        }
        .loader-text {
          color: #98989D;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-loader">
        <svg class="loader-logo" viewBox="0 0 64 64" fill="none">
          <rect width="64" height="64" rx="16" fill="url(#gradient)" />
          <path d="M32 16L44 24V40L32 48L20 40V24L32 16Z" fill="white" fill-opacity="0.9"/>
          <defs>
            <linearGradient id="gradient" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
              <stop stop-color="#007AFF"/>
              <stop offset="1" stop-color="#5856D6"/>
            </linearGradient>
          </defs>
        </svg>
        <div class="loader-spinner"></div>
        <p class="loader-text">Загрузка...</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
